x-spark-common: &spark-common
  build: .
  volumes:
    - ./scripts:/usr/local/airflow/scripts:ro

services:
  database:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-datasource}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  airflow-init:
    image: postgres:14-alpine
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow}
    command:
      - sh
      - -c
      - |
        if ! psql -h database -U "$${POSTGRES_USER}" -d postgres \
          -tAc "SELECT 1 FROM pg_database WHERE datname='$${AIRFLOW_DB}'" | grep -q 1; then
          createdb -h database -U "$${POSTGRES_USER}" "$${AIRFLOW_DB}"
        fi
  airflow:
    build: ./airflow/plugins
    depends_on:
      database:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
    volumes:
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./airflow/dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./database:/opt/airflow/database:rw
    ports:
      - "8080:8080"
    environment:
      PYTHONPATH: /opt/airflow/scripts:/opt/airflow
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-datasource}
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow}
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Data}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-Engineer}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
      # Airflow's Spark provider expects the connection host itself to include
      # the spark:// prefix. Percent-encode it so URI parsing preserves it.
      AIRFLOW_CONN_SPARK_CONN: spark://spark%3A%2F%2Fspark-master:7077
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      DUCKDB_PATH: /opt/airflow/database/config_dwh/mydb.duckdb
    env_file:
      - .env
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        if ! airflow users list | grep -q "$${AIRFLOW_ADMIN_USER}"; then
          airflow users create \
            --username "$${AIRFLOW_ADMIN_USER}" \
            --password "$${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname "$${AIRFLOW_ADMIN_FIRSTNAME}" \
            --lastname "$${AIRFLOW_ADMIN_LASTNAME}" \
            --role Admin \
            --email "$${AIRFLOW_ADMIN_EMAIL}"
        fi
        airflow webserver &
        exec airflow scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  spark-master:
    <<: *spark-common
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8081"
    ports:
      - "7077:7077"
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 10

  spark-worker:
    <<: *spark-common
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "2"
      - --memory
      - 2G
      - spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
  flask-api:
    build: ./flask-api
    ports:
      - "5000:5000"
    volumes:
      - ./database:/opt/airflow/database:ro
    environment:
      DUCKDB_PATH: /opt/airflow/database/config_dwh/mydb.duckdb

volumes:
  postgres_data:
